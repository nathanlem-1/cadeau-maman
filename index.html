<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Un Cadeau d'Exception — 50 ans</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/home.css">
</head>
<body>

<section id="splash">
    <canvas id="splash-bg" aria-hidden="true"></canvas>
    <div>
        <div class="splash-mono">Agnès</div>
        <p class="splash-sub">Maman</p>
    </div>
    <p class="splash-tagline">Un cadeau à la hauteur de tes 50 ans.</p>
    <div class="splash-rule" aria-hidden="true"><div class="splash-rule-dot"></div></div>
    <button id="btn-discover" type="button">Découvrir</button>
</section>

<script>
'use strict';

document.documentElement.classList.add('locked');

function navigateTo(url) {
    document.body.classList.add('exit');
    setTimeout(() => { window.location.href = url; }, 280);
}

document.getElementById('btn-discover').addEventListener('click', () => {
    navigateTo('/cadeaux');
});

/* Particules ambiantes */
(function () {
    const cv     = document.getElementById('splash-bg');
    const cx     = cv.getContext('2d');
    const COLORS = ['#C41E3A','#C41E3A','#B8860B','#D4AF37'];
    let pts = [], alive = true;

    function resize() { cv.width = window.innerWidth; cv.height = window.innerHeight; }
    window.addEventListener('resize', resize, { passive: true });
    resize();

    function spawn() {
        return {
            x: Math.random() * cv.width,
            y: cv.height * (.3 + Math.random() * .7),
            vx: (Math.random() - .5) * .35,
            vy: -(Math.random() * .55 + .18),
            size: Math.random() * 3 + 1,
            diamond: Math.random() > .45,
            color: COLORS[Math.floor(Math.random() * COLORS.length)],
            alpha: 0, maxA: Math.random() * .38 + .08,
            phase: Math.random() * Math.PI * 2,
            freq: Math.random() * .018 + .008
        };
    }

    for (let i = 0; i < 30; i++) {
        const p = spawn();
        p.y = Math.random() * cv.height;
        p.alpha = Math.random() * p.maxA;
        pts.push(p);
    }

    function tick() {
        if (!alive) { cx.clearRect(0, 0, cv.width, cv.height); return; }
        cx.clearRect(0, 0, cv.width, cv.height);
        if (pts.length < 55 && Math.random() < .07) pts.push(spawn());
        pts.forEach(p => {
            p.phase += p.freq;
            p.x += p.vx + Math.sin(p.phase) * .25;
            p.y += p.vy;
            if (p.alpha < p.maxA) p.alpha = Math.min(p.alpha + .006, p.maxA);
            if (p.y < cv.height * .18) p.alpha = Math.max(0, p.alpha - .01);
            if (p.alpha <= 0) return;
            cx.save();
            cx.globalAlpha = p.alpha;
            cx.fillStyle   = p.color;
            cx.translate(p.x, p.y);
            if (p.diamond) { cx.rotate(Math.PI / 4); cx.fillRect(-p.size/2, -p.size/2, p.size, p.size); }
            else { cx.beginPath(); cx.arc(0, 0, p.size/2, 0, Math.PI*2); cx.fill(); }
            cx.restore();
        });
        pts = pts.filter(p => p.alpha > 0 && p.y > -10);
        requestAnimationFrame(tick);
    }
    tick();

    document.getElementById('btn-discover').addEventListener('click', () => {
        setTimeout(() => { alive = false; }, 500);
    }, { once: true });
}());
</script>
</body>
</html>
