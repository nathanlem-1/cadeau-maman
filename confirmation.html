<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Félicitations — 50 ans d'Agnès</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="style.css">
    <style>

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            animation: pageIn .6s var(--ease-out) forwards;
        }

        /* Éléments animés en cascade */
        .conf-eyebrow {
            font-size: .58rem;
            font-weight: 500;
            letter-spacing: .48em;
            text-transform: uppercase;
            color: var(--c-red);
            margin-bottom: 2rem;
            opacity: 0;
            animation: aFadeUp .7s var(--ease-out) .4s forwards;
        }

        .conf-line1 {
            font-family: var(--f-title);
            font-size: clamp(1.1rem, 3vw, 1.75rem);
            font-weight: 300;
            font-style: italic;
            color: rgba(255, 255, 255, .65);
            margin-bottom: .4rem;
            opacity: 0;
            animation: aFadeUp .7s var(--ease-out) .65s forwards;
        }

        .conf-chosen {
            font-family: var(--f-title);
            font-size: clamp(2.2rem, 7vw, 4.8rem);
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: .06em;
            color: var(--c-red);
            line-height: 1.1;
            margin-bottom: 2.5rem;
            opacity: 0;
            animation: aFadeUp .7s var(--ease-out) .9s forwards;
        }

        .conf-ornament {
            margin-bottom: 2rem;
            max-width: 220px;
            opacity: 0;
            animation: aFadeUp .7s var(--ease-out) 1.1s forwards;
        }

        .conf-sub {
            font-size: .85rem;
            font-weight: 300;
            color: rgba(255, 255, 255, .38);
            line-height: 1.95;
            letter-spacing: .03em;
            max-width: 360px;
            opacity: 0;
            animation: aFadeUp .7s var(--ease-out) 1.3s forwards;
        }

        /* Canvas confettis */
        #confetti-canvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
        }

    </style>
</head>
<body>

    <canvas id="confetti-canvas" aria-hidden="true"></canvas>

    <span class="conf-eyebrow">Félicitations</span>
    <p class="conf-line1">Tu as choisi</p>
    <h1 class="conf-chosen" id="conf-chosen"></h1>
    <div class="ornament conf-ornament" aria-hidden="true">
        <div class="ornament-diamond"></div>
    </div>
    <p class="conf-sub">
        Les organisateurs ont été prévenus.<br>
        Profite de ce moment.
    </p>

<script src="gifts-data.js"></script>
<script>
'use strict';

/* ---- Lecture du paramètre ?id ---- */
const params = new URLSearchParams(location.search);
const giftId = parseInt(params.get('id'), 10);
const gift   = GIFTS[giftId];

if (!gift) {
    window.location.replace('index.html');
}

document.getElementById('conf-chosen').textContent = gift.name;

/* ---- Confettis ---- */
const canvas = document.getElementById('confetti-canvas');
const ctx    = canvas.getContext('2d');
const COLORS = ['#C41E3A','#C41E3A','#B8860B','#D4AF37','#8B1020','#FFFFFF'];
let particles = [];
let rafId     = null;

function resizeCanvas() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas, { passive: true });
resizeCanvas();

function makeParticle() {
    return {
        x: Math.random() * canvas.width, y: -12,
        vx: (Math.random() - .5) * 1.5,  vy: Math.random() * 2.5 + .8,
        w: Math.random() * 7 + 2,         h: Math.random() * 14 + 4,
        angle: Math.random() * Math.PI * 2, spin: (Math.random() - .5) * .11,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        alpha: 1
    };
}

function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.angle += p.spin;
        if (p.y > canvas.height * .72) p.alpha -= .016;
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
    });
    particles = particles.filter(p => p.alpha > 0 && p.y < canvas.height + 20);
    if (particles.length > 0) { rafId = requestAnimationFrame(tick); }
    else { ctx.clearRect(0, 0, canvas.width, canvas.height); }
}

/* Lancement des confettis après que le titre soit apparu */
setTimeout(() => {
    let bursts = 0;
    const iv = setInterval(() => {
        for (let i = 0; i < 10; i++) particles.push(makeParticle());
        if (++bursts >= 22) clearInterval(iv);
    }, 55);
    tick();
}, 1000);
</script>
</body>
</html>
